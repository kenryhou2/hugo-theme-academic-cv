source_label: "Evidence-based skill map"
intro: "Conservative matrix assembled from the project pages, author profile, and Henry_Kou_Resume_S25.pdf. Items are phrased as demonstrated exposure or project use, not as proficiency ratings."

summary_cards:
  - value: "6"
    label: "Robotics subsystem areas"
    detail: "Planning, control, manipulation, sensing, locomotion, and embedded/process systems."
  - value: "5+"
    label: "Programming language families"
    detail: "Python and C/C++ are supported by portfolio projects; hardware and analysis languages come from resume references."
  - value: "12+"
    label: "Tools and frameworks"
    detail: "Simulation, optimization, robotics middleware, embedded, electronics, and software tooling."
  - value: "10+"
    label: "Hardware and platforms"
    detail: "Physical robot testbeds, embedded controllers, sensors, FPGA platforms, and power evaluation hardware."

categories:
  - title: "Robotics Subsystems"
    description: "Subsystem areas where the portfolio shows project work, research responsibilities, or course implementations."
    items:
      - name: "Motion planning and search"
        scope: "Weighted A*, time-expanded pursuit, RRT, RRT-Connect, RRT*, PRM, Dijkstra-style graph search, and STRIPS-style task planning."
        evidence: "Implemented in C++ planning projects and manipulation coursework."
        links:
          - label: "A* pursuit"
            url: "/projects/a-star-dynamic-target/"
          - label: "Sampling planners"
            url: "/projects/sampling-based-planners/"
          - label: "Symbolic planner"
            url: "/projects/symbolic-planner/"
          - label: "Manipulation assignments"
            url: "/projects/manipulation-course-assignments/"
      - name: "Control and optimization"
        scope: "Model Predictive Path Integral control, sampling-based MPC, whole-body locomotion costs, process-control timing, PID, and linear feedback coursework."
        evidence: "Shown in MPPI quadruped work, Boeing material deposition research, EigenBot research, and resume coursework/projects."
        links:
          - label: "MPPI quadruped"
            url: "/projects/mppi-wheeled-quadruped/"
          - label: "Boeing deposition"
            url: "/projects/boeing-material-deposition/"
          - label: "EigenBot"
            url: "/projects/eigenbot/"
      - name: "Manipulation and contact"
        scope: "Rigid-body transforms, forward kinematics, screw coordinates, contact screws, friction cones, force closure, antipodal grasp search, IK, and pick-and-place planning."
        evidence: "Implemented through manipulation assignments and connected to Medusa space-arm work."
        links:
          - label: "Manipulation assignments"
            url: "/projects/manipulation-course-assignments/"
          - label: "Medusa Space Arms"
            url: "/projects/medusa-space-arms/"
      - name: "Sensing, mapping, and state estimation"
        scope: "Force sensing, embedded sensing, pipe inspection mapping, misalignment visualization, point-cloud normals, sensor-driven inspection interfaces, and SLAM exposure."
        evidence: "Supported by EigenBot, ARPA-E pipe inspection, manipulation assignments, author bio, and resume research history."
        links:
          - label: "ARPA-E pipe inspection"
            url: "/projects/arpa-e-pipe-inspection/"
          - label: "EigenBot"
            url: "/projects/eigenbot/"
          - label: "Manipulation assignments"
            url: "/projects/manipulation-course-assignments/"
      - name: "Locomotion and modular robots"
        scope: "Wheeled-legged locomotion, gait scheduling, wheel-torque actions, modular limb experiments, force-sensing behavior, and neural-controller research context."
        evidence: "Shown in Unitree Go2W simulation and EigenBot research pages."
        links:
          - label: "MPPI quadruped"
            url: "/projects/mppi-wheeled-quadruped/"
          - label: "EigenBot"
            url: "/projects/eigenbot/"
      - name: "Embedded robotic systems"
        scope: "Sensor interfaces, microcontroller platforms, embedded robot integration, hardware testbenches, and communications buses."
        evidence: "Listed in the resume skills section and reflected in Biorobotics Lab project summaries."
        links:
          - label: "ARPA-E pipe inspection"
            url: "/projects/arpa-e-pipe-inspection/"
          - label: "Medusa Space Arms"
            url: "/projects/medusa-space-arms/"
          - label: "EigenBot"
            url: "/projects/eigenbot/"

