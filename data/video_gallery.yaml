  - title: Sampling-Based Planner Animation
    project: /projects/sampling-based-planners/
    project_label: Sampling Based Planners
    summary: RRT, RRT-Connect, RRT*, and PRM motion-planning experiments for a high-DOF planar arm with collision checking.
    media_type: local-demo
    video_url: https://raw.githubusercontent.com/kenryhou2/hugo-theme-academic-cv/85c445b12e10835991321015e0249291fbe51d16/content/projects/sampling-based-planners/demo.gif
