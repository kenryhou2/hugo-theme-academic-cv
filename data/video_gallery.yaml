    project: /projects/mppi-wheeled-quadruped/
    project_label: MPPI Wheeled Quadruped
    summary: Whole-body MPPI controller for the Unitree Go2W in MuJoCo, with wheel-aware actions and rough-terrain simulation tasks.
    media_type: local-demo
    video_url: https://raw.githubusercontent.com/kenryhou2/hugo-theme-academic-cv/85c445b12e10835991321015e0249291fbe51d16/content/projects/mppi-wheeled-quadruped/demo.gif
